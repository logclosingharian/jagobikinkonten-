function saveImg(segs,t){var W=1080,P=56,FS=64,LH=84,red=t==='red',fam='Arial,Helvetica,sans-serif',cv=document.createElement('canvas'),x=cv.getContext('2d'),words=[],lines=[[]],cw=0,maxW=W-2*P;function fnt(b){return (b?'800 ':'500 ')+FS+'px '+fam}segs.forEach(function(s){String(s.t||'').split(/\s+/).filter(Boolean).forEach(function(w){words.push({w:red?w.toUpperCase():w,b:red||s.b})})});words.forEach(function(o){x.font=fnt(o.b);var sp=x.measureText(' ').width,w=x.measureText(o.w).width,L=lines[lines.length-1];if(L.length&&cw+w>maxW){lines.push([]);L=lines[lines.length-1];cw=0}L.push({w:o.w,b:o.b,x:cw});cw+=w+sp});var H=P+lines.length*LH+150;cv.width=W;cv.height=H;x.fillStyle=red?'#e10b17':'#f2e832';x.fillRect(0,0,W,H);lines.forEach(function(L,i){L.forEach(function(o){x.font=fnt(o.b);x.fillStyle=red?'#fff':'#111';x.fillText(o.w,P+o.x,P+FS+i*LH)})});var pw=red?470:310,ph=96,px=W-P-pw,py=P+lines.length*LH+34;x.fillStyle='#111';rr(x,px,py,pw,ph,48);x.fill();x.fillStyle='#fff';if(red){x.font='800 28px '+fam;x.fillText('SAUDARA CELL',px+34,py+42);x.font='italic 500 24px '+fam;x.fillText('KONTER DIGITAL NO. 1',px+34,py+74)}else{x.strokeStyle='#f2e832';x.lineWidth=8;x.beginPath();x.arc(px+52,py+48,22,0,6.2832);x.stroke();x.font='800 28px '+fam;x.fillText('JAGO',px+98,py+42);x.fillText('CRYPTO',px+98,py+74)}cv.toBlob(function(bl){var u=cv.toDataURL('image/png');try{var f=new File([bl],'judul.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(function(e){if(!e||e.name!=='AbortError')showImg(u)});return}}catch(e){}showImg(u)},'image/png')}/*sve*/
